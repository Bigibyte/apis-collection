name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - name: Ensure generated files are up to date
        run: |
          if ! git diff --quiet README.md data pages; then
            echo "::error::Generated files are stale. Run 'npm run build' and commit the result."
            git diff --stat README.md data pages
            exit 1
          fi
